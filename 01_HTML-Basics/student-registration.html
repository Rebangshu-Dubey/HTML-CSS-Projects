<!DOCTYPE >
<html>
    <head>
        <title>Student Registration Form</title>
    </head>

    <body>
        <h1>Student Registration Form</h1>

        <form>
            
        <label for = "name">Full Name : </label>
        <input type ="text" id = "name" name = "name">
        <br><br>

        <label for = "email">Email : </label>
        <input type = "email" id = "email" name = "email">
        <br><br>

        <label for = "password">Password :</label>
        <input type = "password" id = "password" name = "pqassword">
        <br><br>

        <label for = "Phone">Phone Number :</label>
        <input type ="number" id = "Phone" name = "Phone">
        <br><br>

        <label for = "DOB">Date of Birth :</label>
        <input type = "Date" id = "DOB" name = "DOB">
        <br><br>

        <p>Gender :</p>

        <input type = "radio" id = "male" name = "Gender" value = "male">
        <label for = "male">Male</label>

        <input type = "radio" id = "female" name = "Gender" value = "female">
        <label for = "female">Female</label>
        <br><br>

        <p>Skills :</p>

        <input type = "checkbox" id = "Python" name = "Skills" value = "Python">
        <label for = "Python">Python</label>

        <input type = "checkbox" id = "C" name = "Skills" value = "C">
        <label for = "C">C Programming</label>

        <input type = "checkbox" id = "HTML" name = "Skills" value = "HTML">
        <label for = "HTML">HTML/CSS</label>

        <input type = "checkbox" id = "ML" name = "Skills" value = "ML">
        <label for = "ML">Machine Learning</label>

        <input type = "checkbox" id = "AI" name = "Skills" value = "AI">
        <label for = "AI">Artificial Intelligence</label>

        <input type = "checkbox" id = "Java" name = "Skills" value = "Java">
        <label for = "Java">Java</label>

        <br><br>

        <button type = "Submit">Submit</button>

    </form>

    </body>
</html>
