<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Webpage</title>
</head>
<body>
    <header>
    <h1>My Multimedia Webpage</h1>
    <p>Welcome to my Multimedia Webpage!</p>
    </header>
    
    <main>
                    <!-- Audio Section -->
        <section>
            <h2>Audio Player</h2>

            <p>Listen to this Audio:</p>
        
            <audio controls>
            <source src="media/my-audio.m4a" type="audio/mp4">
            Your browser does not support the audio element.
            </audio>
        </section>

                    <!-- Video Section -->

        <section>
            <h2>Video Player</h2>

            <p>Watch this Video:</p>

            <video controls width="400" height="250">
            <source src="media/my-video.mp4" type="video/mp4">
            Your browser does not support the video element.
            </video>

        </section>

                    <!-- YouTube Video Section -->

        <section>
            <h2>YouTube Video</h2>

            <p>Watch an embedded Youtube video:</p>

            <iframe
            width="560"
            height="315"

            src="https://www.youtube.com/embed/3C18MT-vlJQ?si=68vsAQ_Ju80IPUjo" 
            title="YouTube video player" 

            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 

            allowfullscreen>
            </iframe>
        </section>

    </main>

            <!-- Footer Section -->
    <footer>
        <p>Created by CSE Student<br>
            Copyright &copy; 2026</p>
    </footer>

</body>
</html>
