<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors Practice</title>

    <link rel="stylesheet" href="selectors.css">
</head>


<body>

    <h1 id="main-heading">Learning CSS Selectors</h1>

    <h2>Element Selector</h2>
    <p>This is a normal paragraph.</p>


    <h2>Class Selector</h2>
    <p class="highlight">This paragraph uses a class.</p>
    <p>This paragraph does not use any class.</p>


    <h2>ID Selector</h2>
    <p id="special">This paragraph uses an ID.</p>
    

    <h2>Grouping Selector</h2>
    <p>Learning CSS is interesting.</p>
    
</body>
</html>
